name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Secret scan
        run: python -m scripts.check_secrets
      - name: Lint
        run: ruff check .
      - name: Initialize reproducible data
        run: |
          python -m scripts.init_database
          python -m scripts.build_index --provider hash
      - name: Tests
        env:
          USE_LLM: "false"
        run: python -m pytest -q
      - name: Offline evaluation gates
        env:
          USE_LLM: "false"
          LOG_LEVEL: WARNING
        run: python -m scripts.run_evaluation --enforce
