name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Secret scan
        run: python -m scripts.check_secrets
      - name: Lint
        run: ruff check .
      - name: Initialize reproducible data
        run: |
          python -m scripts.check_evidence
          python -m scripts.validate_human_questions
          python -m scripts.validate_human_scores
          python -m scripts.init_database
          python -m scripts.build_index --provider hash
      - name: Tests
        env:
          USE_LLM: "false"
        run: python -m pytest -q
      - name: Offline evaluation gates
        env:
          USE_LLM: "false"
          LOG_LEVEL: WARNING
        run: python -m scripts.run_evaluation --suite regression --enforce

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t shijian-rag:ci .
      - name: Start dynamic-port container
        run: docker run -d --rm --name shijian-rag-ci -e PORT=7860 -p 7860:7860 shijian-rag:ci
      - name: Smoke test unified UI and API
        run: |
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:7860/readyz && break
            sleep 2
          done
          test "$(docker inspect -f '{{.Config.User}}' shijian-rag-ci)" = "appuser"
          curl --fail --silent http://127.0.0.1:7860/ | grep -q "史鉴 RAG"
          curl --fail --silent http://127.0.0.1:7860/api/v1/meta | grep -q '"event_count":100'
          curl --fail --silent -X POST http://127.0.0.1:7860/api/v1/qa \
            -H 'Content-Type: application/json' -d '{"question":"五四运动"}' | grep -q '"sources"'
      - name: Container logs on failure
        if: failure()
        run: docker logs shijian-rag-ci
      - name: Stop container
        if: always()
        run: docker stop shijian-rag-ci || true
