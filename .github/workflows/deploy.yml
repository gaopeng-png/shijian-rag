name: deploy-public-demo

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.ENABLE_V11_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Require signed evidence and independent human set
        run: |
          python -m scripts.check_evidence --require-verified
          python -m scripts.validate_human_questions --require-final
          python -m scripts.validate_human_scores --require-final
          python -m scripts.init_database
          python -m scripts.build_index --provider hash
          LOG_LEVEL=WARNING python -m scripts.run_evaluation --suite all --enforce

  deploy:
    needs: release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
      MODELSCOPE_STUDIO_PATH: ${{ vars.MODELSCOPE_STUDIO_PATH }}
      MODELSCOPE_DEMO_URL: ${{ vars.MODELSCOPE_DEMO_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_DEMO_URL: ${{ vars.HF_DEMO_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync to ModelScope, fall back to Hugging Face
        id: sync
        shell: bash
        run: |
          if [[ -n "$MODELSCOPE_TOKEN" && -n "$MODELSCOPE_STUDIO_PATH" ]]; then
            if git push --force "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/studios/${MODELSCOPE_STUDIO_PATH}.git" HEAD:main; then
              echo "url=$MODELSCOPE_DEMO_URL" >> "$GITHUB_OUTPUT"
              echo "provider=modelscope" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -z "$HF_TOKEN" || -z "$HF_SPACE_ID" ]]; then
            echo "ModelScope sync unavailable and Hugging Face fallback is not configured" >&2
            exit 1
          fi
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" HEAD:main
          echo "url=$HF_DEMO_URL" >> "$GITHUB_OUTPUT"
          echo "provider=huggingface" >> "$GITHUB_OUTPUT"
      - name: Online smoke and load test
        if: steps.sync.outputs.url != ''
        run: python -m scripts.smoke_deployment "${{ steps.sync.outputs.url }}" --full-load
