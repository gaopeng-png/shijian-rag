[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shijian-rag"
version = "1.0.1"
description = "A traceable hybrid-RAG question answering system for history learning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "高鹏" }]
dependencies = [
    "chromadb==0.6.3",
    "fastapi==0.136.3",
    "gradio==6.16.0",
    "langchain-chroma==0.2.3",
    "langchain-core==1.5.0",
    "langchain-openai==1.2.2",
    "openai==2.41.0",
    "pandas==2.2.3",
    "posthog==5.4.0",
    "pydantic==2.11.7",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.11.13",
]

[project.scripts]
shijian-ui = "ui.gradio_app:main"
shijian-init = "scripts.init_database:main"
shijian-index = "scripts.build_index:main"
shijian-eval = "scripts.run_evaluation:main"

[tool.setuptools.packages.find]
include = ["app*", "ui*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["chroma_history_db", "storage", ".venv", "output", ".playwright-cli"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
